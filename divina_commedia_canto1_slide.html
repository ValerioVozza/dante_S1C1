<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inferno · Canto I · in terzine</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b1d12; --parch:#f1e4c3; --edge:#c9ab72; --red:#8b1e1e; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; display:flex; flex-direction:column; align-items:center;
    background:#3a2a1c radial-gradient(circle at 50% 0%, #5a4029, #1a120b 80%);
    font-family:'IM Fell English', Georgia, serif; color:var(--ink);
  }
  header { text-align:center; padding:14px 10px 6px; color:#efe4c8; }
  header h1 { font-family:'UnifrakturMaguntia', serif; font-weight:normal; font-size:clamp(1.6rem,4vw,2.4rem); margin:0; color:#e8c66a; }
  header p { margin:2px 0 0; font-style:italic; opacity:.8; }
  .stage { flex:1; width:100%; max-width:980px; padding:10px 16px; display:flex; align-items:center; }
  .slide {
    width:100%; padding:24px 28px 22px;
    background:var(--parch);
    background-image:radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 60%),radial-gradient(ellipse at 80% 90%, rgba(140,100,40,.25), transparent 60%);
    border:2px solid var(--edge); border-radius:4px;
    box-shadow:0 0 0 7px #e6d3a6, 0 0 0 9px var(--edge), 0 20px 60px rgba(0,0,0,.6), inset 0 0 80px rgba(120,80,30,.3);
    transition:opacity .35s ease, transform .35s ease;
  }
  .slide.out { opacity:0; transform:translateY(8px); }
  .tag { text-align:center; color:var(--red); letter-spacing:.18em; font-size:.85rem; margin-bottom:10px; }
  .pic { display:flex; gap:8px; justify-content:center; }
  .pic svg { width:100%; max-height:46vh; height:auto; border:3px double var(--ink); border-radius:2px; display:block; }
  .pic.tri svg { width:33%; }
  .verses { margin:18px auto 0; max-width:640px; font-size:clamp(1.15rem,2.4vw,1.55rem); line-height:1.5; }
  .verse { display:flex; gap:14px; padding:2px 10px; border-radius:6px; transition:background .25s, color .25s; }
  .verse .num { width:2.2em; text-align:right; color:var(--red); opacity:.6; font-size:.7em; padding-top:.45em; flex:none; }
  .verse.on { background:rgba(139,30,30,.12); color:#5a0e0e; }
  .verse:first-child .txt::first-letter { font-family:'UnifrakturMaguntia', serif; color:var(--red); font-size:1.35em; }
  .bar { width:100%; max-width:980px; padding:6px 16px 18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; color:#efe4c8; }
  button, select { font-family:inherit; font-size:1rem; border:1px solid var(--edge); background:#f1e4c3; color:var(--ink); border-radius:6px; padding:7px 14px; cursor:pointer; }
  button:hover { background:#fff3d6; }
  button.primary { background:var(--red); color:#f7f0d8; border-color:#5a0e0e; }
  button.primary:hover { background:#a52626; }
  button.toggle.on { background:#e8c66a; }
  select { max-width:220px; padding:6px 8px; }
  .count { min-width:72px; text-align:center; }
  .progress { width:100%; max-width:980px; height:4px; background:rgba(255,255,255,.12); }
  .progress div { height:100%; background:#e8c66a; width:0; transition:width .3s; }
  label.rate { display:flex; align-items:center; gap:6px; font-size:.95rem; }
  .note { font-size:.85rem; opacity:.7; text-align:center; width:100%; }
  @media (max-width:640px){ .slide{padding:16px 12px;} .pic.tri{flex-direction:column;} .pic.tri svg{width:100%; max-height:22vh;} }
</style>
</head>

<header>
  <h1>La Divina Commedia</h1>
  <p>Inferno · Canto I · in terzine</p>
</header>
<div class="progress"><div id="prog"></div></div>

<div class="stage">
  <div class="slide" id="slide">
    <div class="tag" id="tag"></div>
    <div class="pic" id="pic"></div>
    <div class="verses" id="verses"></div>
  </div>
</div>

<div class="bar">
  <button id="prev" title="Indietro (←)">◀</button>
  <span class="count" id="count"></span>
  <button id="next" title="Avanti (→)">▶</button>
  <button class="primary" id="play" title="Leggi (spazio)">🔊 Leggi</button>
  <button class="toggle" id="auto" title="Legge e passa da sola alla terzina successiva">Lettura continua</button>
  <select id="voice" title="Voce"></select>
  <label class="rate">Velocità <input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="0.9"></label>
  <div class="note" id="note"></div>
</div>

<script>
/* ===== Libreria di disegno ===== */
const SK='#7a1616', INK='#2b1d12', SKIN='#d9b48a';
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const bg=k=>`<rect width="400" height="260" fill="url(#g-${k})"/>`;
function sun(x,y,r=22,rays=true){let s='';if(rays){s+=`<g stroke="#fff3c4" stroke-width="2.5" opacity=".75">`;for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${(x+Math.cos(a)*(r+6)).toFixed(1)}" y1="${(y+Math.sin(a)*(r+6)).toFixed(1)}" x2="${(x+Math.cos(a)*(r+20)).toFixed(1)}" y2="${(y+Math.sin(a)*(r+20)).toFixed(1)}"/>`}s+='</g>'}return s+`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff3c4" stroke="#f6c453" stroke-width="4"/>`}
const moon=(x,y,r=18)=>`<path d="M${x} ${y-r} A${r} ${r} 0 1 0 ${x} ${y+r} A${r*.7} ${r} 0 1 1 ${x} ${y-r}Z" fill="#efe4c8"/>`;
function stars(n,seed=1,ymax=120,c='#efe4c8'){const r=rnd(seed);let s=`<g fill="${c}">`;for(let i=0;i<n;i++)s+=`<circle cx="${(r()*400).toFixed(1)}" cy="${(r()*ymax).toFixed(1)}" r="${(0.7+r()*1.2).toFixed(1)}"/>`;return s+'</g>'}
function forest(x0,x1,base,h,col='#0f150f',n=8,seed=3){const r=rnd(seed);let s=`<g fill="${col}">`;const w=(x1-x0)/n;for(let i=0;i<n;i++){const cx=x0+w*i+w/2+(r()-.5)*w*.4;const hh=h*(.7+r()*.5);s+=`<path d="M${(cx-w*.75).toFixed(1)} ${base} L${cx.toFixed(1)} ${(base-hh).toFixed(1)} L${(cx+w*.75).toFixed(1)} ${base}Z"/>`}return s+'</g>'}
function hill(lit=true,dim=false){return `<path d="M120 260 Q200 50 280 70 Q350 90 400 190 V260Z" fill="${lit?'url(#g-hill)':'#4b5a2e'}" stroke="${INK}" stroke-width="1.5" ${dim?'opacity=".55"':''}/>`+(lit&&!dim?`<path d="M178 118 Q222 62 280 72 Q330 80 360 120" stroke="#fff3c4" stroke-width="4" fill="none" opacity=".7"/>`:'')}
const ground=(c='#9bb06a',y=205)=>`<path d="M0 ${y} Q200 ${y-14} 400 ${y} V260 H0Z" fill="${c}"/>`;
const slope=(c='#c9a86a')=>`<path d="M0 260 L0 230 L400 90 V260Z" fill="${c}" stroke="#8a6f3e" stroke-width="2"/>`;
const label=(x,y,t,size=14,c=INK,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="IM Fell English, serif" font-size="${size}" fill="${c}" ${extra}>${t}</text>`;
function bubble(x,y,w,h,lines,tx,ty,size=14){let t='';lines.forEach((l,i)=>t+=`<text x="${x+w/2}" y="${(y+h/2+(i-(lines.length-1)/2)*(size+3)+size*.35).toFixed(1)}" text-anchor="middle" font-family="IM Fell English, serif" font-style="italic" font-size="${size}" fill="${INK}">${l}</text>`);
  return `<path d="M${x+w*.4} ${y+h-2} L${tx} ${ty} L${x+w*.58} ${y+h-2}Z" fill="#f7f0d8" stroke="${INK}" stroke-width="1.5"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#f7f0d8" stroke="${INK}" stroke-width="1.5"/><path d="M${x+w*.4+2} ${y+h-1} L${x+w*.58-2} ${y+h-1}" stroke="#f7f0d8" stroke-width="4"/>${t}`}
const trem=(x,y,c='#efe4c8')=>`<g stroke="${c}" stroke-width="1.6" fill="none" opacity=".85"><path d="M${x-26} ${y} q-5 6 0 12 q5 6 0 12"/><path d="M${x+26} ${y} q5 6 0 12 q-5 6 0 12"/><path d="M${x-34} ${y+8} q-5 6 0 12"/><path d="M${x+34} ${y+8} q5 6 0 12"/></g>`;
const tears=(x,y)=>`<g fill="#7fb3d5"><path d="M${x} ${y} q-3 6 0 8 q3 -2 0 -8Z"/><path d="M${x+3} ${y+11} q-3 6 0 8 q3 -2 0 -8Z"/></g>`;
function arrow(x1,y1,x2,y2,c='#8b1e1e',curve=0){const mx=(x1+x2)/2,my=(y1+y2)/2-curve;const a=Math.atan2(y2-my,x2-mx),h=11;return `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="${c}" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/><path d="M${x2} ${y2} L${(x2-h*Math.cos(a-0.45)).toFixed(1)} ${(y2-h*Math.sin(a-0.45)).toFixed(1)} L${(x2-h*Math.cos(a+0.45)).toFixed(1)} ${(y2-h*Math.sin(a+0.45)).toFixed(1)}Z" fill="${c}"/>`}

const T=[
["Nel mezzo del cammin di nostra vita","mi ritrovai per una selva oscura,","ché la diritta via era smarrita."],
["Ahi quanto a dir qual era è cosa dura","esta selva selvaggia e aspra e forte","che nel pensier rinova la paura!"],
["Tant’è amara che poco è più morte;","ma per trattar del ben ch’i’ vi trovai,","dirò de l’altre cose ch’i’ v’ho scorte."],
["Io non so ben ridir com’i’ v’intrai,","tant’era pien di sonno a quel punto","che la verace via abbandonai."],
["Ma poi ch’i’ fui al piè d’un colle giunto,","là dove terminava quella valle","che m’avea di paura il cor compunto,"],
["guardai in alto e vidi le sue spalle","vestite già de’ raggi del pianeta","che mena dritto altrui per ogne calle."],
["Allor fu la paura un poco queta,","che nel lago del cor m’era durata","la notte ch’i’ passai con tanta pieta."],
["E come quei che con lena affannata,","uscito fuor del pelago a la riva,","si volge a l’acqua perigliosa e guata,"],
["così l’animo mio, ch’ancor fuggiva,","si volse a retro a rimirar lo passo","che non lasciò già mai persona viva."],
["Poi ch’èi posato un poco il corpo lasso,","ripresi via per la piaggia diserta,","sì che ’l piè fermo sempre era ’l più basso."],
["Ed ecco, quasi al cominciar de l’erta,","una lonza leggera e presta molto,","che di pel macolato era coverta;"],
["e non mi si partia dinanzi al volto,","anzi ’mpediva tanto il mio cammino,","ch’i’ fui per ritornar più volte vòlto."],
["Temp’era dal principio del mattino,","e ’l sol montava ’n sù con quelle stelle","ch’eran con lui quando l’amor divino"],
["mosse di prima quelle cose belle;","sì ch’a bene sperar m’era cagione","di quella fiera a la gaetta pelle"],
["l’ora del tempo e la dolce stagione;","ma non sì che paura non mi desse","la vista che m’apparve d’un leone."],
["Questi parea che contra me venisse","con la test’alta e con rabbiosa fame,","sì che parea che l’aere ne tremesse."],
["Ed una lupa, che di tutte brame","sembiava carca ne la sua magrezza,","e molte genti fé già viver grame,"],
["questa mi porse tanto di gravezza","con la paura ch’uscia di sua vista,","ch’io perdei la speranza de l’altezza."],
["E qual è quei che volontieri acquista,","e giugne ’l tempo che perder lo face,","che ’n tutti suoi pensier piange e s’attrista;"],
["tal mi fece la bestia sanza pace,","che, venendomi ’ncontro, a poco a poco","mi ripigneva là dove ’l sol tace."],
["Mentre ch’i’ rovinava in basso loco,","dinanzi a li occhi mi si fu offerto","chi per lungo silenzio parea fioco."],
["Quando vidi costui nel gran diserto,","«Miserere di me», gridai a lui,","«qual che tu sii, od ombra od omo certo!»."],
["Rispuosemi: «Non omo, omo già fui,","e li parenti miei furon lombardi,","mantoani per patrïa ambedui."],
["Nacqui sub Iulio, ancor che fosse tardi,","e vissi a Roma sotto ’l buono Augusto","nel tempo de li dèi falsi e bugiardi."],
["Poeta fui, e cantai di quel giusto","figliuol d’Anchise che venne di Troia,","poi che ’l superbo Ilïón fu combusto."],
["Ma tu perché ritorni a tanta noia?","perché non sali il dilettoso monte","ch’è principio e cagion di tutta gioia?»."],
["«Or se’ tu quel Virgilio e quella fonte","che spandi di parlar sì largo fiume?»,","rispuos’io lui con vergognosa fronte."],
["«O de li altri poeti onore e lume,","vagliami ’l lungo studio e ’l grande amore","che m’ha fatto cercar lo tuo volume."],
["Tu se’ lo mio maestro e ’l mio autore,","tu se’ solo colui da cu’ io tolsi","lo bello stilo che m’ha fatto onore."],
["Vedi la bestia per cu’ io mi volsi;","aiutami da lei, famoso saggio,","ch’ella mi fa tremar le vene e i polsi»."],
["«A te convien tenere altro vïaggio»,","rispuose, poi che lagrimar mi vide,","«se vuo’ campar d’esto loco selvaggio;"],
["ché questa bestia, per la qual tu gride,","non lascia altrui passar per la sua via,","ma tanto lo ’mpedisce che l’uccide;"],
["e ha natura sì malvagia e ria,","che mai non empie la bramosa voglia,","e dopo ’l pasto ha più fame che pria."],

["Questi non ciberà terra né peltro,","ma sapïenza, amore e virtute,","e sua nazion sarà tra feltro e feltro."],
["Di quella umile Italia fia salute","per cui morì la vergine Cammilla,","Eurialo e Turno e Niso di ferute."],

/* disegni: terzine 1-2 = trittici dei primi sei versi; 3-10 = disegni già fatti; 11-46 = nuove scene */
function svgFor(i){ // i: 1-based
  const tpl=id=>document.getElementById(id).innerHTML;
  if(i===1) return {tri:true, html:tpl('old0')+tpl('old1')+tpl('old2')};
  if(i===2) return {tri:true, html:tpl('old3')+tpl('old4')+tpl('old5')};
  if(i<=10) return {tri:false, html:tpl('old'+(i+3))};
  return {tri:false, html:`<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">${S[i]()}</svg>`};
}

const $=id=>document.getElementById(id);
let cur=0;
function render(){
  const i=cur+1, lines=T[cur], first=cur*3+1;
  $('tag').textContent = (lines.length===3? `TERZINA ${i}` : 'VERSO FINALE') + `  ·  vv. ${first}${lines.length>1?'–'+(first+lines.length-1):''}`;
  const p=svgFor(i); $('pic').className='pic'+(p.tri?' tri':''); $('pic').innerHTML=p.html;
  $('verses').innerHTML=lines.map((l,k)=>`<div class="verse" id="v${k}"><span class="num">${first+k}</span><span class="txt">${l}</span></div>`).join('');
  $('count').textContent=`${i} / ${T.length}`;
  $('prog').style.width=(i/T.length*100)+'%';
  $('prev').disabled=cur===0; $('next').disabled=cur===T.length-1;
}
function go(n,keepReading){
  if(n<0||n>=T.length) return;
  if(!keepReading) stop();
  const s=$('slide'); s.classList.add('out');
  setTimeout(()=>{cur=n;render();s.classList.remove('out'); if(keepReading) readSlide();},250);
}

/* ===== Voce (Web Speech API: in Chrome usa le voci Google) ===== */
const synth=window.speechSynthesis; let voices=[], runId=0, reading=false, auto=false;
function loadVoices(){
  if(!synth) return;
  voices=synth.getVoices();
  const it=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('it'));
  const list=(it.length?it:voices).slice().sort((a,b)=>(/google/i.test(b.name))-(/google/i.test(a.name)));
  const prev=$('voice').value;
  $('voice').innerHTML=list.map(v=>`<option value="${v.name}">${v.name}${/google/i.test(v.name)?' ★':''}</option>`).join('');
  if(prev && list.some(v=>v.name===prev)) $('voice').value=prev;
  const hasGoogle=it.some(v=>/google/i.test(v.name));
  $('note').textContent = !voices.length ? '' : hasGoogle ? 'Voce Google italiana attiva ★' :
    'La voce “Google italiano” c’è solo in Google Chrome: apri la pagina con Chrome per sentirla. Ora si usa la voce italiana del sistema.';
}
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; } else { $('note').textContent='Questo browser non supporta la lettura ad alta voce.'; }

const clean=t=>t.replace(/[«»]/g,'').replace(/’/g,"'");
function readSlide(){
  if(!synth) return;
  synth.cancel(); const id=++runId; reading=true; $('play').textContent='⏸ Ferma';
  const lines=T[cur]; const v=voices.find(x=>x.name===$('voice').value);
  const say=k=>{
    if(id!==runId) return;
    document.querySelectorAll('.verse').forEach(e=>e.classList.remove('on'));
    if(k>=lines.length){
      if(auto && cur<T.length-1){ setTimeout(()=>{ if(id===runId) go(cur+1,true); },900); }
      else { reading=false; $('play').textContent='🔊 Leggi'; }
      return;
    }
    $('v'+k).classList.add('on');
    const u=new SpeechSynthesisUtterance(clean(lines[k]));
    u.lang='it-IT'; if(v) u.voice=v; u.rate=+$('rate').value; u.pitch=0.95;
    u.onend=()=>setTimeout(()=>say(k+1), k===lines.length-1?0:250);
    u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled') say(k+1); };
    synth.speak(u);
  };
  say(0);
}
function stop(){ runId++; reading=false; if(synth) synth.cancel(); $('play').textContent='🔊 Leggi'; document.querySelectorAll('.verse').forEach(e=>e.classList.remove('on')); }

$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
$('play').onclick=()=> reading? stop() : readSlide();
$('auto').onclick=()=>{ auto=!auto; $('auto').classList.toggle('on',auto); $('auto').textContent=auto?'Lettura continua ✓':'Lettura continua'; if(auto&&!reading) readSlide(); };
$('voice').onchange=()=>{ if(reading) readSlide(); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1);
  else if(e.key===' '){ e.preventDefault(); reading?stop():readSlide(); }
});
let tx=null; document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>60) go(cur+(d<0?1:-1)); tx=null; });
render();
</script>
